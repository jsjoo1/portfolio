<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>카드 실적 수첩</title>

<!-- 파비콘 -->
<link rel="icon" href="favicon.png?v=2" type="image/png">
<link rel="apple-touch-icon" href="favicon.png?v=2">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* 기존 스타일 유지 (이 아래는 동일) */
:root { --bg: #121318; --surface: #1c1d24; --surface-sub: #252732; --line: #2b2d3a; --text: #ffffff; --text-soft: #8f95b2; --primary: #6c5ce7; --primary-glow: rgba(108, 92, 231, 0.25); --ok: #22c55e; --ok-soft: rgba(34, 197, 94, 0.15); --danger: #ef4444; --danger-soft: rgba(239, 68, 68, 0.15); --radius: 20px; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background-color: #0b0c0e; font-family: "Pretendard", system-ui, sans-serif; color: var(--text); }
.app { max-width: 640px; margin: 0 auto; background: var(--bg); min-height: 100vh; position: relative; }
/* ... 상단 스타일 동일하므로 생략 (아래 필수 부분만 추가) ... */

/* 월 선택 모달 스타일 */
.month-picker-sheet {
  background: var(--surface); padding: 20px; border-radius: 20px 20px 0 0;
  display: flex; flex-direction: column; gap: 10px;
}
</style>
</head>
<body>

<div class="app" id="app"></div>

<script type="module">
// [Firebase 및 데이터 로직은 기존과 동일하므로 생략 (전체 코드 복사 필수)]
// (상단 Firebase 설정 및 데이터 변수 선언 부분은 이전과 동일하게 유지하세요)

// [핵심 로직: 이벤트 위임 방식]
function bindEvents() {
  document.body.onclick = function(e) {
    var target = e.target;
    
    // 1. 메모 수정 모달 열기 (이벤트 위임)
    if (target.closest('[data-act="openEditMemo"]')) {
      var id = target.closest('[data-act="openEditMemo"]').dataset.id;
      if (e.target.closest('[data-act="delmemo"]')) return; // 삭제 버튼은 무시
      editingMemoId = id;
      modal = 'editmemo';
      render();
    }

    // 2. 월 직접 선택 모달 (달력 대신 연/월 선택)
    if (target.closest('.month-label')) {
      var y = prompt("연도를 입력하세요 (예: 2026)", monthKey.split('-')[0]);
      var m = prompt("월을 입력하세요 (1~12)", monthKey.split('-')[1]);
      if (y && m) {
        monthKey = y + '-' + String(m).padStart(2, '0');
        subscribeMonth(monthKey);
      }
    }
    
    // ... 나머지 bindEvents들 (이전 코드의 로직을 그대로 유지하세요)
  };
}

// render() 함수의 메모 항목 렌더링 부분을 이렇게 위임에 맞춰 수정
// html += '<div class="note-item-box" data-act="openEditMemo" data-id="' + m.id + '">';
// (클래스나 data 속성을 유지하면 됩니다)

</script>
</body>
</html>
