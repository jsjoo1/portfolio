<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>카드 실적 수첩</title>
<link rel="icon" href="favicon.png?v=2" type="image/png">
<link rel="apple-touch-icon" href="favicon.png?v=2">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --bg: #121318; --surface: #1c1d24; --surface-sub: #252732; --line: #2b2d3a; --text: #ffffff; --text-soft: #8f95b2; --primary: #6c5ce7; --primary-glow: rgba(108, 92, 231, 0.25); --ok: #22c55e; --ok-soft: rgba(34, 197, 94, 0.15); --danger: #ef4444; --danger-soft: rgba(239, 68, 68, 0.15); --radius: 20px; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background-color: #0b0c0e; font-family: "Pretendard", system-ui, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
.app { max-width: 640px; margin: 0 auto; background: var(--bg); min-height: 100vh; position: relative; }
.header-container { padding: 24px 20px 16px; }
.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.app-title { font-size: 22px; font-weight: 800; }
.tool-btn { background: var(--surface-sub); border: 1px solid var(--line); color: var(--text-soft); border-radius: 20px; padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
.tool-btn.danger { color: var(--danger); border-color: rgba(239, 68, 68, 0.3); }
.month-nav { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; cursor: pointer; }
.month-label { font-size: 20px; font-weight: 800; border-bottom: 1px dashed var(--text-soft); }
.summary-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; margin-top: 10px; }
.page { padding: 0 20px 100px; }
.section-title { font-weight: 800; font-size: 15px; color: var(--text-soft); margin: 24px 4px 12px; display: flex; justify-content: space-between; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 14px; }
.more-toggle-btn { margin-top: 14px; background: transparent; border: none; font-size: 12px; color: var(--text-soft); font-weight: 700; cursor: pointer; width: 100%; text-align: left; }
.detail-body { display: none; margin-top: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.detail-body.show { display: block; }
.row-line { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.03); }
.editable-amt { cursor: pointer; border-bottom: 1px dashed var(--primary); padding: 2px 4px; }
.editable-amt-input { width: 90px; background: var(--surface-sub); border: 1px solid var(--primary); color: var(--text); text-align: right; }
.notes-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 20px; }
.note-item-box { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.fab { position: fixed; right: 20px; bottom: 24px; width: 58px; height: 58px; border-radius: 50%; background: var(--primary); color: #fff; border: none; font-size: 28px; z-index: 99; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: flex-end; z-index: 100; }
.sheet { background: var(--surface); width: 100%; border-radius: 28px 28px 0 0; padding: 20px; max-height: 80vh; overflow-y: auto; }
.field { margin-bottom: 15px; }
.field input, .field select { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-sub); color: #fff; }
.primary-btn { width: 100%; background: var(--primary); color: #fff; border: none; padding: 14px; border-radius: 14px; font-weight: 800; }
.chip { display: inline-block; padding: 6px 12px; border: 1px solid var(--line); border-radius: 20px; margin: 3px; font-size: 12px; cursor: pointer; }
.chip.active { background: var(--primary); border-color: var(--primary); }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = { apiKey: "AlzaSyA29fT3VqGxdBWulCF7wNuNlulgoRICsfA", authDomain: "portfolio-87ccf.firebaseapp.com", projectId: "portfolio-87ccf", storageBucket: "portfolio-87ccf.firebasestorage.app", messagingSenderId: "965398567245", appId: "1:965398567245:web:ad2a58bb178de82a423f04" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

var cards = [], memos = [], monthKey = currentMonthKey(), monthData = {}, modal = null, editingFixedId = null, editingMemoId = null, expandedCards = {}, newMemoMonths = [], resetType = 'txOnly';

function currentMonthKey() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function won(n) { return Math.round(n || 0).toLocaleString('ko-KR') + '원'; }
function uid() { return Math.random().toString(36).slice(2, 9); }
function emptyMonthData() { return {_meta: {appliedRecurring: [], skipRecurring: false}}; }

async function persistMonth() { await setDoc(doc(db, "app_data", "month-" + monthKey), monthData); }
async function persistMemos() { await setDoc(doc(db, "app_data", "memos"), { data: memos }); }

function applyRecurring() {
  var meta = monthData._meta || (monthData._meta = {appliedRecurring: [], skipRecurring: false});
  if (meta.skipRecurring) return false;
  var mm = parseInt(monthKey.split('-')[1], 10);
  var changed = false;
  memos.forEach(rec => {
    var cId = rec.cardId || rec.cardid;
    if (!cId || !rec.amount || !rec.months || rec.months.indexOf(mm) === -1) return;
    if (!monthData[cId]) monthData[cId] = {fixed: [], tx: []};
    if (!monthData[cId].fixed.some(f => f.recurringId === rec.id)) {
      monthData[cId].fixed.push({id: uid(), label: rec.text, amount: Number(rec.amount) || 0, recurringId: rec.id});
      changed = true;
    }
  });
  return changed;
}

function subscribeMonth(key) {
  onSnapshot(doc(db, "app_data", "month-" + key), async (docSnap) => {
    monthData = docSnap.exists() ? docSnap.data() : emptyMonthData();
    if (applyRecurring()) await persistMonth();
    render();
  });
}

function render() {
  const app = document.getElementById('app');
  let html = `
    <div class="header-container">
      <div class="top-bar">
        <div class="app-title">카드 실적 수첩</div>
        <div class="header-tools">
          <button class="tool-btn" onclick="modal='cards'; render()">카드 설정</button>
          <button class="tool-btn" onclick="modal='memos'; render()">메모 설정</button>
        </div>
      </div>
      <div class="month-nav" onclick="changeMonthPrompt()">
        <div class="month-label">${monthKey}</div>
      </div>
    </div>
    <div class="page">
      <div class="section-title"><span>카드별 실적</span><button class="tool-btn danger" onclick="modal='reset'; render()">당월 초기화</button></div>
  `;
  cards.forEach(card => {
    const d = monthData[card.id] || {fixed: [], tx: []};
    const isExpanded = !!expandedCards[card.id];
    html += `
      <div class="card">
        <div>${card.bank} ${card.product}</div>
        <button class="more-toggle-btn" onclick="expandedCards['${card.id}']=!expandedCards['${card.id}']; render()">
          ${isExpanded ? '내역 접기 ∧' : '내역 자세히 보기 ∨'}
        </button>
        <div class="detail-body ${isExpanded ? 'show' : ''}">
          ${d.fixed.map(f => `
            <div class="row-line">
              <span>${f.label}</span>
              <span class="editable-amt" onclick="editingFixedId='${f.id}'; render()">${won(f.amount)}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  });
  html += `
    <div class="section-title"><span>참고 메모</span><button class="tool-btn primary" onclick="reloadMemosToMonth()">불러오기</button></div>
    <div class="notes-card">
      ${memos.map(m => `
        <div class="note-item-box" onclick="editingMemoId='${m.id}'; modal='editmemo'; render()">
          <span>• ${m.text}</span>
          <button class="rl-del" onclick="event.stopPropagation(); removeMemo('${m.id}')">✕</button>
        </div>
      `).join('')}
    </div>
  `;
  app.innerHTML = html;
}

// 전역 함수로 노출
window.changeMonthPrompt = function() {
  var input = prompt("연-월을 입력하세요 (예: 2026-09)", monthKey);
  if (input) { monthKey = input; subscribeMonth(monthKey); }
};
window.reloadMemosToMonth = reloadMemosToMonth;
window.removeMemo = removeMemo;
window.render = render;

initRealtimeListeners();
</script>
</body>
</html>
